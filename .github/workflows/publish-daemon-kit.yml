name: Publish daemon-kit

# Trusted publishing (OIDC): no long-lived npm tokens. npm CLI detects the
# OIDC environment automatically (requires npm >= 11.5.1). Configure the
# trusted publisher on npmjs.com: org=DanyPops repo=daemon-kit workflow=publish-daemon-kit.yml
#
# Targets packages/daemon-kit on daemon-kit-v* tags -- distinct from every
# other package's own tag prefix, so no two packages' publishes can race on
# the same trigger.

on:
  push:
    tags:
      - "daemon-kit-v*"

permissions:
  id-token: write # Required for OIDC
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: oven-sh/setup-bun@v2

      - run: bun install
      - run: bun run --cwd packages/daemon-kit build
      - run: bun run --cwd packages/daemon-kit test
      - run: bun run --cwd packages/daemon-kit typecheck

      # npm CLI only for the publish step (trusted publishing needs >= 11.5.1).
      # NO registry-url here: it makes setup-node write an .npmrc with an empty
      # NODE_AUTH_TOKEN line, which shadows OIDC auto-detection and breaks
      # trusted publishing with a 404.
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          package-manager-cache: false

      # Trusted publishing needs npm >= 11.5.1; Node's bundled npm can be older.
      - run: npm install -g npm@latest && npm --version

      - run: npm publish --access public
        working-directory: packages/daemon-kit
