name: Publish vehicle-client

# Trusted publishing (OIDC), same shape as every other publish-*.yml in this
# workspace. Configure the trusted publisher on npmjs.com: org=DanyPops
# repo=vehicle workflow=publish-vehicle-client.yml

on:
  push:
    tags:
      - "vehicle-client-v*"

permissions:
  id-token: write
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: oven-sh/setup-bun@v2

      - run: bun install
      # Full workspace build -- vehicle-client depends on @danypops/vehicle-core
      # and @danypops/vehicle-server (LocalVehicleClient's VehicleRegistry type).
      - run: bun run build
      - run: bun run --cwd packages/vehicle-client test
      - run: bun run --cwd packages/vehicle-client typecheck

      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          package-manager-cache: false

      - run: npm install -g npm@latest && npm --version

      # Bun's workspace:* protocol is not understood by npm's own resolver --
      # rewrite it to a real ^version before publish, or every real npm
      # consumer gets an unresolvable dependency (confirmed live: the first
      # publish of vehicle-server/vehicle-client/vehicle-conformance shipped
      # exactly this, deprecated and republished once found).
      - run: node scripts/resolve-workspace-deps.mjs packages/vehicle-client

      - run: npm publish --access public
        working-directory: packages/vehicle-client
