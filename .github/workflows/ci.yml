name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - uses: oven-sh/setup-bun@v2
      - run: bun install
      - run: bun run check
      - run: bun run typecheck
      - if: matrix.os == 'ubuntu-latest'
        run: bun run lint:deps
      - if: matrix.os == 'ubuntu-latest'
        run: bun run test
      - if: matrix.os != 'ubuntu-latest'
        run: bun test packages/armada/test
